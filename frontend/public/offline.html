<!doctype html>
<html lang="en-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6d6">
  <meta name="robots" content="noindex">
  <title>You're offline · Gather Dessert</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 1rem/1.6 system-ui, sans-serif; color: #40020d; background: #fff6d6; }
    main { max-width: 30rem; background: #fffdf0; border: 1px solid #dfc6bd; border-top: 6px solid #fe8f95;
      border-radius: 20px; padding: clamp(24px, 6vw, 44px); }
    .brand { font-weight: 700; } h1 { font: 600 2.25rem/1.15 Georgia, serif; }
    a { color: #40020d; text-underline-offset: .2em; }
    .retry { display: inline-block; padding: 12px 24px; margin: 8px 0 16px; border-radius: 12px;
      background: #40020d; color: #fffdf0; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #40020d; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Gather Dessert</p>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to browse desserts, view your orders, or continue checkout.</p>
    <p>If you were submitting an order or payment proof, check its status when you're back online before trying again.</p>
    <a class="retry" href="">Try again</a><br>
    <a href="/">Back to Gather Dessert</a>
  </main>
</body>
</html>
